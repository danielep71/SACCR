name: Published Wiki observations
on:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wiki-drift:
    name: Published Wiki comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Compare Wiki with recorded source
        env:
          WIKI_REPOSITORY: ${{ github.repository }}
          WIKI_READBACK: ${{ runner.temp }}/wiki-readback
          WIKI_SOURCE_TREE: ${{ runner.temp }}/wiki-source
        run: |
          set -euo pipefail
          mkdir -p test-results
          git clone --depth 1 "https://github.com/${WIKI_REPOSITORY}.wiki.git" "$WIKI_READBACK"
          source_sha="$(python - "$WIKI_READBACK/Wiki-Source.json" "$WIKI_REPOSITORY" <<'PY'
          import json, re, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              record = json.load(handle)
          sha = record.get("source_sha", "")
          if record.get("repository") != sys.argv[2] or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid Wiki-Source.json")
          print(sha)
          PY
          )"
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          git cat-file -e "${source_sha}^{commit}"
          git worktree add --quiet --detach "$WIKI_SOURCE_TREE" "$source_sha"
          python "$WIKI_SOURCE_TREE/tools/check_wiki.py" --root "$WIKI_SOURCE_TREE" --published-dir "$WIKI_READBACK"             --output test-results/wiki-drift.json --summary test-results/wiki-drift.md
          printf 'PASS: published Wiki matches source %s.\n' "$source_sha" >test-results/wiki-observation.md
      - name: Retain observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiki-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/wiki-*
          if-no-files-found: error
          retention-days: 30
